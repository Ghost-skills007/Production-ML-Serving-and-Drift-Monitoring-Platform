# One command to rule them all:
#   docker compose up --build
# Starts the serving API, PostgreSQL and the Streamlit dashboard.
# The drift job runs on demand:
#   docker compose --profile jobs run --rm drift-job

name: ml-serving-drift-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mlmonitor}
      POSTGRES_USER: ${POSTGRES_USER:-mluser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema is applied automatically on first boot.
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mluser} -d ${POSTGRES_DB:-mlmonitor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MODEL_STORE: local
      MODEL_DIR: /app/models
      MODEL_VERSION: latest
      # DEMO_DATASET=adult to train the UCI model instead of the offline demo.
      DEMO_DATASET: ${DEMO_DATASET:-breast_cancer}
      DB_ENABLED: "1"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-mlmonitor}
      POSTGRES_USER: ${POSTGRES_USER:-mluser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${COMPOSE_API_PORT:-8000}:8000"
    volumes:
      - models_data:/app/models

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-mlmonitor}
      POSTGRES_USER: ${POSTGRES_USER:-mluser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "8501:8501"

  # One-off drift analysis. Not started by `up` (behind the "jobs" profile).
  drift-job:
    build: .
    profiles: ["jobs"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MODEL_STORE: local
      MODEL_DIR: /app/models
      MODEL_VERSION: latest
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-mlmonitor}
      POSTGRES_USER: ${POSTGRES_USER:-mluser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - models_data:/app/models
    # Override the API entrypoint and run the drift job once.
    entrypoint: ["python", "-m", "monitoring.run_drift_job", "--window", "1000"]

volumes:
  postgres_data:
  models_data:
